# Optional: trigger an existing Render service redeploy.
# One-shot create path (no secrets needed in GitHub): Render Dashboard → Blueprints
# → connect roosevelt-jpg/triada-designs → apply root render.yaml.
#
# Repo secret required for this workflow: RENDER_DEPLOY_HOOK_URL
# (Render → Service → Settings → Deploy Hook)
name: Deploy API (Render)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infrastructure/docker/api.Dockerfile"
      - "render.yaml"
      - ".github/workflows/deploy-api-render.yml"

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK}" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set."
            echo "Create the service once via https://dashboard.render.com/blueprints"
            echo "(repo render.yaml → triada-api), then add the Deploy Hook as a GitHub secret."
            echo "Custom domain target: api.triada-designs.com"
            echo "Meta Callback URL: https://api.triada-designs.com/api/webhooks/meta"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Render deploy hook triggered."
