services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: triada
      MYSQL_USER: triada
      MYSQL_PASSWORD: triada
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - triada_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - triada_redis:/data

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    environment:
      APP_URL: http://127.0.0.1:8088
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: triada
      DB_USERNAME: triada
      DB_PASSWORD: triada
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      INTEGRATION_MODE: mock
    ports:
      - "8088:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8088/api
    ports:
      - "43127:43127"
    depends_on:
      - api

volumes:
  triada_mysql:
  triada_redis:
