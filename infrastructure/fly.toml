# Fly.io app config — use when FLY_API_TOKEN is available:
#   fly apps create triada-api
#   fly secrets set APP_KEY=... APP_URL=https://triada-api.fly.dev ...
#   fly deploy --dockerfile infrastructure/docker/api.Dockerfile --context apps/api

app = "triada-api"
primary_region = "iad"

[build]
  dockerfile = "docker/api.Dockerfile"
  ignorefile = "../apps/api/.dockerignore"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://api.triada-designs.com"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/html/database/database.sqlite"
  LOG_CHANNEL = "stderr"
  INTEGRATION_MODE = "live"
  META_VERIFY_TOKEN = "triada-local-verify"
  FRONTEND_URL = "https://dashboard.triada-designs.com"
  CORS_ALLOWED_ORIGINS = "https://dashboard.triada-designs.com,https://triada-ops.vercel.app,http://127.0.0.1:43127,http://localhost:43127"
  SANCTUM_STATEFUL_DOMAINS = "dashboard.triada-designs.com,triada-ops.vercel.app,localhost,localhost:43127,127.0.0.1,127.0.0.1:43127"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"
