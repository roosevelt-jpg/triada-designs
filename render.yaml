# Render Blueprint — Triada Laravel API (Hobby/free-friendly)
# Deploy: https://dashboard.render.com/blueprints → connect GitHub
#   roosevelt-jpg/triada-designs (main). Or set RENDER_API_KEY for CLI/API.
# Custom domain: attach api.triada-designs.com in Render → then at GoDaddy
#   (ns71/ns72.domaincontrol.com) add CNAME Host=api → <service>.onrender.com
# Meta Callback URL: https://api.triada-designs.com/api/webhooks/meta
# Vercel Production: API_ORIGIN=https://api.triada-designs.com (no trailing slash)
services:
  - type: web
    name: triada-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://api.triada-designs.com
      - key: APP_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://dashboard.triada-designs.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dashboard.triada-designs.com,https://triada-ops.vercel.app,http://127.0.0.1:43127,http://localhost:43127
      - key: SANCTUM_STATEFUL_DOMAINS
        value: dashboard.triada-designs.com,triada-ops.vercel.app,localhost,localhost:43127,127.0.0.1,127.0.0.1:43127
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: INTEGRATION_MODE
        value: live
      - key: META_VERIFY_TOKEN
        value: triada-local-verify
      - key: LOG_CHANNEL
        value: stderr
